name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"

      - name: Locate Android SDK
        shell: bash
        run: |
          set -e

          if [ -n "${ANDROID_SDK_ROOT:-}" ]; then
            SDK_ROOT="$ANDROID_SDK_ROOT"
          elif [ -n "${ANDROID_HOME:-}" ]; then
            SDK_ROOT="$ANDROID_HOME"
          else
            echo "ERROR: Android SDK location not found."
            exit 1
          fi

          echo "Android SDK: $SDK_ROOT"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Find sdkmanager
        shell: bash
        run: |
          set -e

          SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" \
            -type f \
            -name "sdkmanager" \
            -print -quit 2>/dev/null || true)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            find "$ANDROID_SDK_ROOT" \
              -maxdepth 6 \
              -type f \
              -name "sdkmanager" \
              -print
            exit 1
          fi

          echo "sdkmanager found at:"
          echo "$SDKMANAGER"

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Accept required Android SDK licenses
        shell: bash
        run: |
          set -e

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_SDK_ROOT" \
            --licenses > sdk-licenses.log 2>&1 || true

          echo "Android SDK license step completed."

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -e

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          echo "Checking Android 36..."
          test -d "$ANDROID_SDK_ROOT/platforms/android-36"

          echo "Checking Build Tools 36.0.0..."
          test -d "$ANDROID_SDK_ROOT/build-tools/36.0.0"

          echo "Android SDK verification successful."

      - name: Extract project ZIP if necessary
        shell: bash
        run: |
          set -e

          if find . -type f \( \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" \
          \) -print -quit | grep -q .; then

            echo "Gradle project is already extracted."

          else

            ZIP_FILE=$(find . -type f -iname "*.zip" -print -quit || true)

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: No Gradle project and no ZIP file were found."
              echo "Repository contents:"
              find . -maxdepth 3 -print
              exit 1
            fi

            echo "Extracting: $ZIP_FILE"

            mkdir -p extracted-project
            unzip -q "$ZIP_FILE" -d extracted-project

            echo "Extraction complete."
          fi

      - name: Find Gradle project root
        shell: bash
        run: |
          set -e

          SETTINGS_FILE=$(find . -type f \( \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" \
          \) -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle was not found after extraction."
            echo "Repository contents:"
            find . -maxdepth 5 -print
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Gradle project root: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build debug APK
        shell: bash
        run: |
          set -e

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew :app:assembleDebug \
              --no-daemon \
              --stacktrace
          else
            gradle :app:assembleDebug \
              --no-daemon \
              --stacktrace
          fi
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Find generated APK
        shell: bash
        run: |
          set -e

          echo "Searching for APK files..."

          find "${PROJECT_DIR}" \
            -type f \
            -name "*.apk" \
            -print

          APK_FILE=$(find "${PROJECT_DIR}" \
            -type f \
            -path "*/build/outputs/apk/*/*.apk" \
            -print -quit)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: Build completed, but no APK was found."
            exit 1
          fi

          echo "APK found: $APK_FILE"
          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WeirdGamepadLauncher-V2-Phase1-APK
          path: ${{ env.APK_FILE }}
          if-no-files-found: error
